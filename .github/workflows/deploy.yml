name: Deploy to Hetzner

on:
  push:
    branches: [main, claude/math-learning-app-qwCOV]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 46.225.232.67
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /root/Math-teacher || git clone https://github.com/Omribarzi/Math-teacher.git /root/Math-teacher
            cd /root/Math-teacher
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            docker compose up -d --build
